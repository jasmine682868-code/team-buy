  if(id) return 'https://lh3.googleusercontent.com/d/' + id; return url;
}

  // ── 上半部：口味牌價橫向矩陣
  var topTbl='<div class="oat-matrix-wrap"><table class="oat-matrix-table"><tbody>';
  topTbl+='<tr><td class="row-label">口味 <span style="color:var(--accent);font-weight:700">('+N+'項)</span></td>';
  flavors.forEach(function(f){
    var imgUrl=normalizeImgUrl(f.img||'');
    var icoSafe=(f.icon||'🥣').replace(/'/g,'&#39;');
    var imgWrap=imgUrl
      ? '<div class="flavor-img-wrap"><img src="'+imgUrl+'" onerror="this.parentElement.innerHTML=\'<div class=&quot;flavor-img-fb&quot;>'+icoSafe+'</div>\'"></div>'
      : '<div class="flavor-img-wrap"><div class="flavor-img-fb">'+(f.icon||'🥣')+'</div></div>';
    var tagHtml=f.tag?'<div><span class="flavor-tag">'+f.tag+'</span></div>':'';
    topTbl+='<td class="flavor-head">'+imgWrap+'<div class="flavor-name">'+f.name+'</div>'+tagHtml+'</td>';
  });
  topTbl+='</tr>';
  if(allSameSpec){
    topTbl+='<tr><td class="row-label">規格</td><td colspan="'+N+'">'+(flavors[0].spec||'')+'</td></tr>';
  } else {
    topTbl+='<tr><td class="row-label">規格</td>';
    flavors.forEach(function(f){ topTbl+='<td>'+(f.spec||'')+'</td>'; });
    topTbl+='</tr>';
  }
  topTbl+='<tr><td class="row-label">官網牌價</td>';
  flavors.forEach(function(f){ topTbl+='<td class="price-num">$'+(+(f.price)||0).toLocaleString()+'</td>'; });
  topTbl+='</tr></tbody></table></div>';

  // ── 下半部：方案橫向矩陣
  var pkgTbl='<div class="oat-matrix-wrap"><table class="oat-pkg-table"><thead><tr><th>品名</th>';
  flavors.forEach(function(f){ pkgTbl+='<th>'+f.name+'</th>'; });
  pkgTbl+='</tr></thead><tbody>';

  oats.packages.forEach(function(p){
    var type=p.type||'mixed';
    var qty=+p.qty||1;
    var price=+p.price||0;
    var fNames=Array.isArray(p.fixedFlavors)?p.fixedFlavors:[];
    var origPrice=0;
    if(type==='fixed') origPrice=fNames.reduce(function(s,n){return s+(+(byName[n]&&byName[n].price)||0);},0);
    else origPrice=maxP*qty;
    var avg=qty>0?Math.round(price/qty):0;
    var disc=origPrice>0?Math.round(price/origPrice*100):null;
    var desc=(p.desc||'').trim();
    if(!desc){
      if(type==='fixed') desc=fNames.length?'綜合體驗組（'+fNames.join('/')+'）':'綜合體驗組';
      else if(type==='single') desc='單口味 '+qty+' 包';
      else desc=fNames.length?'指定 '+fNames.length+' 種口味任選':'全口味任選';
    }
    var span=Math.max(N,1);
    pkgTbl+='<tr>'
      +'<td class="pkg-name-col">'+(p.name||'(未命名)')+'</td>'
      +'<td class="pkg-cell '+type+'" colspan="'+span+'">'
      +'<div class="oat-pkg-cell-price">'+price.toLocaleString()+'</div>'
      +'<div class="oat-pkg-cell-meta">'+(disc!=null?'<span class="disc-pct">'+disc+'折</span>':'')+'每包 $'+avg.toLocaleString()+'</div>'
      +'<div class="oat-pkg-cell-desc">('+desc+')</div>'
      +'</td></tr>';
  });
  pkgTbl+='</tbody></table></div>';

  document.getElementById('vo').innerHTML=oatsFh+topTbl+pkgTbl;
}

function switchTab(t,btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  document.getElementById('vp').style.display=t==='p'?'':'none';
  document.getElementById('vc').style.display=t==='c'?'':'none';
  document.getElementById('vf').style.display=t==='f'?'':'none';
  document.getElementById('vo').style.display=t==='o'?'':'none';
  document.getElementById('tabEdit').style.display=t==='edit'?'':'none';
  if(t==='products')renderP(); else if(t==='combos')renderC(); else if(t==='frozen')renderF(); else if(t==='oats')renderO(); else if(t==='edit')renderEdit();
}
renderP(); renderC(); renderF(); renderO();
const _styles={"--fs-pname":"36px","--fs-spec":"16px","--fs-th":"16px","--main-font":"'PingFang TC', 'Noto Sans TC', sans-serif","--fs-product-name":"21px","--fs-tier-price":"17px","--fs-tier-small":"13px","--fs-title":"24px","--fs-official":"15px","--fs-frozen-base":"16px","--fs-combo-price":"16px"};
if(_styles){Object.entries(_styles).forEach(function(kv){document.documentElement.style.setProperty(kv[0],kv[1]);});}
if(_styles['--fs-title']) document.getElementById('outTitle').style.fontSize=_styles['--fs-title'];
// 各分頁獨立樣式覆蓋（套在容器上）
const _tabStyles={"products":{},"combos":{"--fs-tier-price":"21px","--fs-tier-small":"12px"},"frozen":{"--fs-product-name":"18px","--fs-tag":"12px"},"oats":{}};
if(_tabStyles){
  var _tabIdMap={products:'vp',combos:'vc',frozen:'vf',oats:'vo'};
  Object.keys(_tabStyles).forEach(function(tab){
    var el=document.getElementById(_tabIdMap[tab]); if(!el) return;
    var ts=_tabStyles[tab]||{};
    Object.keys(ts).forEach(function(k){ el.style.setProperty(k, ts[k]); });
  });
}
</script></body></html>

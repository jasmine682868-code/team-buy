    sc.forEach(s=>{
      const best=s.avg===minA;
      const avgs=s.groups>1?'<span style="font-weight:'+(best?'700':'400')+';color:'+(best?'var(--accent2)':'var(--text)')+'">$'+s.avg.toLocaleString()+'</span>':'<span style="color:var(--muted)">—</span>';
      let gs='';if(s.gn)gs+='<span style="font-size:10px;color:var(--accent2)">🎁 '+s.gn+'</span>';
      if(s.gv>0){if(gs)gs+='<br>';gs+='<span style="font-size:11px;color:#7b5ea7">$'+s.gv.toLocaleString()+(s.groups>1?' <span style="font-size:10px;color:var(--muted)">（每組 $'+Math.round(s.gv/s.groups).toLocaleString()+'）</span>':'')+'</span>';}
      if(!gs)gs='<span style="color:var(--border)">—</span>';
      cmp+='<div style="display:grid;grid-template-columns:110px 90px 90px 1fr;gap:6px;align-items:start;padding:4px 0;border-bottom:1px solid #f0ede8"><span style="font-size:12px;font-weight:'+(best?'700':'400')+';color:'+(best?'var(--accent2)':'var(--text)')+'">'+s.label+(best?' <span class="compare-badge">最划算</span>':'')+'</span><span style="font-family:'DM Mono',monospace;font-size:12px">$'+s.total.toLocaleString()+'</span><span style="font-family:'DM Mono',monospace;font-size:12px">'+avgs+'</span><span>'+gs+'</span></div>';
    });
    cmp+='</div>';
    const rid='rc'+ci;const rb=c.remark?'<button class="remark-btn" onclick="toggleRemark(''+rid+'')">備註 ▾</button><div class="remark-box" id="'+rid+'">'+c.remark+'</div>':'';
    h+='<tr><td><div class="combo-contents">'+cont+'</div>'+rb+'</td><td>'+(orig?'<span class="combo-original">$'+orig.toLocaleString()+'</span>':'—')+'</td><td><span class="combo-price">$'+c.price.toLocaleString()+'</span></td><td>'+(save&&save>0?'<span class="combo-save">省 $'+save.toLocaleString()+'</span><br>':'')+(d?'<span class="combo-disc">'+d+'%</span>':'—')+'</td><td>'+cmp+'</td></tr>';
  });
  document.getElementById('vc').innerHTML=h+'</tbody></table>';
}
function switchTab(t,btn){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('vp').style.display=t==='p'?'':'none';document.getElementById('vc').style.display=t==='c'?'':'none';}
renderP();renderC();
// apply saved styles
const _styles='+JSON.stringify(cfg.styles||{})+';
if(_styles){Object.entries(_styles).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));}
</script></body></html>

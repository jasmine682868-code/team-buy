    <style>
        :root {
            --primary: #d32f2f;
            --primary-light: #ffebee;
            --bg-color: #f5f5f5;
        }
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 32px;
        }
        .header p {
            color: #666;
            margin-top: 0;
        }
        .section-title {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            color: var(--primary);
            margin-top: 40px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
        }
        .card-header {
            padding: 15px 20px;
            background-color: var(--primary-light);
            border-bottom: 1px solid #ffcdd2;
        }
        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #b71c1c;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }
        .card-tag {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .card-meta {
            font-size: 13px;
            color: #555;
        }
        .card-body {
            padding: 20px;
            flex-grow: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        th, td {
            border-bottom: 1px solid #eee;
            padding: 10px 5px;
            text-align: left;
            font-size: 14px;
        }
        th {
            color: #888;
            font-weight: normal;
        }
        .price-highlight {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1em;
        }
        .note-text {
            color: #e65100;
            font-size: 12px;
            display: block;
            margin-top: 3px;
        }
        .combo-items {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            font-size: 15px;
            line-height: 1.6;
        }
        .combo-items li::before {
            content: "✦ ";
            color: var(--primary);
        }
        .combo-price-box {
            background-color: #fff8e1;
            padding: 15px;
            border-radius: 8px;
            margin-top: auto;
        }
        .combo-price {
            font-size: 24px;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>

// 渲染單品列表

data.products.forEach(p => {
    let tiersHtml = '';
    p.tiers.forEach(t => {
        let note = t.note ? `<span class="note-text">${t.note}</span>` : '';
        tiersHtml += `
            <tr>
                <td>${t.qty} ${p.unitLabel}</td>
                <td class="price-highlight">$${t.price}</td>
                <td>${t.giftCount > 0 ? '🎁 ' : ''}${note}</td>
            </tr>
        `;
    });

    let tagHtml = p.tag ? `<div class="card-tag">${p.tag}</div>` : '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
        <div class="card-header">
            <h3 class="card-title">${p.name}</h3>
            ${tagHtml}
            <div class="card-meta">規格: ${p.spec} | 官方原價: $${p.official}</div>
        </div>
        <div class="card-body">
            <table>
                <thead>
                    <tr>
                        <th width="20%">數量</th>
                        <th width="35%">團購價</th>
                        <th>備註</th>
                    </tr>
                </thead>
                <tbody>
                    ${tiersHtml}
                </tbody>
            </table>
        </div>
    `;
    productsContainer.appendChild(card);
});

data.combos.forEach(c => {

    });
    
    let giftHtml = c.comboGift ? `<div style="color:#d32f2f; margin-top:10px; font-size:14px; border-top:1px dashed #ccc; padding-top:10px;"><strong>🎁 贈品:</strong> ${c.comboGift} (價值 $${c.comboGiftValue})</div>` : '';

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
        <div class="card-header">
            <h3 class="card-title">${c.name}</h3>
        </div>
        <div class="card-body" style="display:flex; flex-direction:column;">
            <ul class="combo-items">
                ${itemsHtml}
            </ul>
            <div class="combo-price-box">
                <div>組合價</div>
                <div class="combo-price">$${c.price}</div>

            </div>
